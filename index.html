
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WEB FANZINE</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="escenario">

        <!-- REVISTA -->
        <div class="revista-contenedor">

            <div id="book">

                
                <div class="page portada" data-density="hard">

                    <img
                        src="assets/imagenportada.png"
                        alt="Imagen de portada de la revista"
                        class="portada-imagen"
                    >
                </div>

                
                <div class="page">

                    <img
                        src="assets/imagenpag2.png"
                        alt="Imagen de la página 2"
                        class="pagina-imagen-completa"
                    >
                </div>

                
                <div class="page">

                    <img
                        src="assets/imagenpag3.png"
                        alt="Imagen de la página 3"
                        class="pagina-imagen-completa"
                    >
                </div>

                
                <div class="page">

                    <div class="contenido">

                        <h2>Galería</h2>

                        <img
                            src="assets/portada.jpg"
                            alt="Imagen de la revista"
                            class="imagen-revista"
                        >

                        <p>
                            Las imágenes van a ocupar gran parte
                        
                        </p>

                        <span class="numero">04</span>

                    </div>
                </div>

                
                <div class="page">

                    <div class="contenido">

                        <h2>Hasta aquí...</h2>

                        <p>
                            Este es un ejemplo de cómo
                            distribuir el contenido dentro
                            de la revista.
                        </p>

                        <span class="numero">05</span>

                    </div>
                </div>

                
                <div class="page contraportada" data-density="hard">

                    <div class="contenido portada-contenido">

                        <h2>FIN</h2>

                        <p>Gracias por leer.</p>

                    </div>
                </div>

            </div>
        </div>

        
        <div class="controles">

            <button id="anterior">← Anterior</button>

            <button id="siguiente">Siguiente →</button>

        </div>

    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    
    <script src="java.js"></script>

</body>
</html>
