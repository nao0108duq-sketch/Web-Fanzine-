<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segunda revista</title>
    <link rel="stylesheet" href="estiloPag2.css">
</head>
<body>
    <main class="escenario">
        <div class="revista-contenedor">
            <div id="book" aria-label="Revista de seis páginas">
                <div class="page portada" data-density="hard" aria-label="Portada">
                    <img
                        src="assets%20pagina%202/portadapag2.jpg"
                        alt="Portada de la segunda revista"
                        class="portada-imagen"
                    >
                </div>
                <div class="page" aria-label="Página 2"><span class="numero">2</span></div>
                <div class="page" aria-label="Página 3"><span class="numero">3</span></div>
                <div class="page" aria-label="Página 4"><span class="numero">4</span></div>
                <div class="page" aria-label="Página 5"><span class="numero">5</span></div>
                <div class="page contraportada" data-density="hard" aria-label="Contraportada"></div>
            </div>
        </div>

        <nav class="controles" aria-label="Controles de la revista">
            <button id="anterior" type="button">← Anterior</button>
            <button id="siguiente" type="button">Siguiente →</button>
            <a href="index.html">Volver al inicio</a>
        </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="javaPag2.js"></script>
</body>
</html>
